<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi - Designazioni Arbitri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--primario);
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--carta);
    border-radius: var(--radius);
    box-shadow: var(--ombra-lg);
    padding: 32px 28px;
  }
  .login-card h1 {
    font-family: "Oswald", sans-serif;
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--primario);
  }
  .login-card p.hint { margin: 0 0 20px; }
  .login-card .form-field { margin-bottom: 14px; }
  .login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--testo-tenue); }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--bordo);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    box-sizing: border-box;
  }
  .login-errore {
    background: var(--rosso-tinta);
    color: var(--rosso-scuro);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 13.5px;
    margin-bottom: 14px;
  }
  .login-card button {
    width: 100%;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Designazioni Arbitri</h1>
    <p class="hint">Accesso riservato alla sezione arbitri</p>
    {% if errore %}
      <div class="login-errore">{{ errore }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-field">
        <label>Utente</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Accedi</button>
    </form>
  </div>
</body>
</html>
